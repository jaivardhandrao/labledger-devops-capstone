name: LabLedger delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install isolated test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run API and migration tests
        working-directory: backend
        run: python -m pytest -v
      - name: Check Python quality
        working-directory: backend
        run: ruff check app tests
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  scan-and-publish:
    if: github.event_name != 'pull_request'
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set immutable image identity
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Build this architecture locally before promotion
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --load \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t "$IMAGE:$IMAGE_TAG" "${{ matrix.component }}"
      - name: Fail on every HIGH or CRITICAL container vulnerability
        run: |
          mkdir -p evidence-ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/evidence-ci:/out" \
            aquasec/trivy:0.75.0 image \
            --platform linux/${{ matrix.arch }} --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 \
            --format json --output /out/trivy.json "$IMAGE:$IMAGE_TAG"
      - name: Save actual scan report, including failed scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}-${{ matrix.arch }}
          path: evidence-ci/trivy.json
          if-no-files-found: warn
      - name: Authenticate to GHCR after successful scan
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the scanned SHA-architecture image
        run: docker push "$IMAGE:$IMAGE_TAG"
  publish-multiarch-sha:
    needs: scan-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Promote both images only when all four scans passed
        run: |
          for component in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            docker buildx imagetools create -t "$image:$GITHUB_SHA" \
              "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          done

name: labledger-capstone
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init-env.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init-env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [data]
  backend:
    build: ./backend
    image: labledger-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
    depends_on:
      database:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    networks: [web, data]
  frontend:
    build: ./frontend
    image: labledger-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:3000:8080"]
    security_opt: [no-new-privileges:true]
    networks: [web]
volumes:
  postgres-data:
networks:
  web:
  data:
    internal: true

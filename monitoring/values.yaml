# kube-prometheus-stack, release monitoring, namespace monitoring.
# Install this only into an approved cluster. All UIs remain ClusterIP.
fullnameOverride: monitoring
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 6h
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector:
      matchLabels:
        release: monitoring
    podMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
grafana:
  # Keep the capstone dashboard; avoid dozens of unrelated classroom dashboards.
  defaultDashboardsEnabled: false
  deploymentStrategy:
    type: Recreate
  startupProbe:
    httpGet: {path: /api/health, port: grafana}
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 120
  service:
    type: ClusterIP
  # Create this Secret manually, outside Git; do not commit real credentials.
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: username
    passwordKey: password
  persistence:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 1000m, memory: 384Mi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
alertmanager:
  enabled: false
# The operator and applicable exporters provide cluster CPU/HPA panels.
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}

# Keep this small classroom stack focused on application evidence.
defaultRules:
  create: false
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 96Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}

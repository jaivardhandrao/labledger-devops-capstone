apiVersion: v1
kind: Service
metadata:
  name: {{ include "labledger.fullname" . }}-frontend
  labels:
    {{- include "labledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "labledger.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labledger.fullname" . }}-backend
  labels:
    {{- include "labledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "labledger.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

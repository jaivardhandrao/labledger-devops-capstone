{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "labledger.fullname" . }}
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "labledger.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.release }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- include "labledger.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: 10s
{{- end }}
